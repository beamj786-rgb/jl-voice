name: Development build checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_package:
        description: Upload a portable Windows test package after checks pass
        required: false
        type: boolean
        default: false
      quality_benchmark:
        description: Run paired public CZ/EN Base and Small CPU probe
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-cpu-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Developer benchmark dependencies
        run: python -m pip install -r benchmarks/requirements.txt
      - name: PCM meter and hold-key checks
        run: dotnet run --project tests/JLVoice.CoreChecks -c Release
      - name: Native Windows insertion and tagged Caps toggle checks
        timeout-minutes: 2
        shell: pwsh
        run: |
          dotnet publish tests/JLVoice.DesktopChecks -c Release -r win-x64 --self-contained true -o artifacts/desktop-checks
          if ($LASTEXITCODE -ne 0) { throw 'Desktop checks did not build.' }
          & ./artifacts/desktop-checks/JLVoice.DesktopChecks.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop input checks failed.' }
      - name: Build self-contained CPU package (not a release)
        shell: pwsh
        run: ./scripts/package.ps1 -IncludeSmall -IncludeTurbo
      - name: Paired public CZ and EN CPU quality probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.quality_benchmark }}
        shell: pwsh
        run: |
          python benchmarks/fetch_public.py --output artifacts/public-corpus
          if ($LASTEXITCODE -ne 0) { throw 'Public corpus fetch failed.' }
          python benchmarks/compare.py --runtime artifacts/JLVoice/runtime/JLVoiceAsr.exe --model artifacts/JLVoice/models/ggml-base-q5_1.bin --model artifacts/JLVoice/models/ggml-small-q5_1.bin --corpus artifacts/public-corpus/corpus.json --repeats 1 --threads 2 --output artifacts/quality-probe
          if ($LASTEXITCODE -ne 0) { throw 'Paired CPU probe failed.' }
      - name: Verify portable package integrity helper
        shell: powershell
        run: ./artifacts/JLVoice/Check-Package.ps1
      - name: Signature inventory and fail-closed signing preparation
        shell: pwsh
        run: ./tests/package-signing.ps1 -PackageDirectory ./artifacts/JLVoice
      - name: Original-binary metadata for Foundation review
        shell: pwsh
        run: ./tests/signpath-readiness.ps1 -PackageDirectory ./artifacts/JLVoice -ReportPath ./artifacts/signpath-readiness.json
      - name: Scoring and native audio boundary checks
        shell: pwsh
        run: |
          $env:JL_VOICE_WORKER = "$pwd/artifacts/JLVoice/runtime/JLVoiceAsr.exe"
          python -m unittest discover -s benchmarks -v
      - name: Public English fixture through real CPU worker
        shell: pwsh
        run: |
          dotnet run --project tests/JLVoice.CoreChecks -c Release -- --roundtrip vendor/whisper.cpp/samples/jfk.wav artifacts/capture-roundtrip.wav
          if ($LASTEXITCODE -ne 0) { throw 'Capture WAV serialization failed.' }
          $env:PYTHONPATH = "$pwd/benchmarks"
          @'
          from pathlib import Path
          from run import run_sample
          result = run_sample(Path('artifacts/JLVoice/runtime/JLVoiceAsr.exe').resolve(), Path('artifacts/JLVoice/models/ggml-base-q5_1.bin').resolve(), Path('artifacts/capture-roundtrip.wav').resolve(), 'en', 2)
          assert 'country' in result['text'].lower()
          print('Public English fixture passed. This is not Czech, mixed-language, or minimum-hardware acceptance.')
          '@ | python -
      - name: Windows tray startup and idle monitor smoke test
        run: python benchmarks/app.py --app artifacts/JLVoice/JLVoice.exe --seconds 12 --scenario idle --output artifacts/ci-idle.json
      - name: Native UI render and layout review
        timeout-minutes: 2
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$pwd/artifacts/JLVoice/JLVoice.exe" -ArgumentList '--ui-review', "$pwd/artifacts/ui-review" -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "UI review failed: $($app.ExitCode)" }
      - name: Review screenshots and measurement metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ui-review
          path: |
            artifacts/ui-review/
            artifacts/ci-idle.json
            artifacts/signpath-readiness.json
            artifacts/quality-probe/
            artifacts/public-corpus/corpus.json
            artifacts/JLVoice/SIGNATURES.json
            artifacts/JLVoice/BUILD-INFO.json
          if-no-files-found: warn
          retention-days: 7
      - name: Owner-requested portable development test package
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.test_package }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JLVoice-Windows-x64-test
          path: artifacts/JLVoice/
          if-no-files-found: error
          retention-days: 7
      # No GitHub Release or deployment. Application upload is manual opt-in only.
  stt-experiment:
    # Developer-only paired decoding experiment on identical public audio; no package or default change.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.quality_benchmark }}
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Benchmark dependencies
        run: python -m pip install -r benchmarks/requirements.txt
      - name: Build pinned CPU worker
        shell: pwsh
        run: |
          git clone https://github.com/ggml-org/whisper.cpp.git vendor/whisper.cpp
          git -C vendor/whisper.cpp checkout --detach d1be6fde11ac6e0407606b4e42fe72d34add8037
          if ($LASTEXITCODE -ne 0) { throw 'Pinned whisper.cpp checkout failed.' }
          cmake -S native -B artifacts/native -A x64 "-DWHISPER_SOURCE=$PWD/vendor/whisper.cpp" -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DBUILD_SHARED_LIBS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed.' }
          cmake --build artifacts/native --config Release --target JLVoiceAsr --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Worker build failed.' }
          $env:JL_VOICE_WORKER = "$PWD/artifacts/native/bin/Release/JLVoiceAsr.exe"
          python benchmarks/test_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Native worker checks failed.' }
      - name: Fetch models and public corpus
        shell: pwsh
        run: |
          foreach ($m in 'ggml-base-q5_1.bin','ggml-small-q5_1.bin','ggml-large-v3-turbo-q5_0.bin') {
            python benchmarks/fetch_model.py --model $m --output artifacts/models | Tee-Object -Append artifacts/model-provenance.jsonl
            if ($LASTEXITCODE -ne 0) { throw "Model fetch failed: $m" }
          }
          python benchmarks/fetch_public.py --output artifacts/stt-corpus --count 10 --controls
          if ($LASTEXITCODE -ne 0) { throw 'Public corpus fetch failed.' }
      - name: Paired decoding experiment
        shell: pwsh
        run: |
          python benchmarks/experiment.py --runtime artifacts/native/bin/Release/JLVoiceAsr.exe --models artifacts/models --corpus artifacts/stt-corpus/corpus.json --output artifacts/stt-experiment --only small --only turbo+short --only turbo
          if ($LASTEXITCODE -ne 0) { throw 'Experiment failed.' }
          Copy-Item artifacts/model-provenance.jsonl, artifacts/stt-corpus/corpus.json artifacts/stt-experiment/
      - name: Upload experiment results (no audio)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stt-experiment
          path: artifacts/stt-experiment/
          if-no-files-found: warn
          retention-days: 14
