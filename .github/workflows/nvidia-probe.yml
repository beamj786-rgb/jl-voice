name: NVIDIA model probes (development only)
on:
  workflow_dispatch:
    inputs:
      cloud_kit_only:
        description: Build only the cloud test kit (skip the slow local Parakeet CPU probe)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-probes:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Developer-only pinned CPU benchmark dependencies
        run: python -m pip install sherpa-onnx==1.12.40 psutil==7.2.2 numpy==2.3.5
      - name: Public paired fixtures and integrity-pinned local model
        if: ${{ !inputs.cloud_kit_only }}
        shell: pwsh
        run: |
          python benchmarks/fetch_public.py --output artifacts/public-corpus
          if ($LASTEXITCODE -ne 0) { throw 'Public fixture fetch failed.' }
          python benchmarks/fetch_parakeet.py --output artifacts/parakeet-model
          if ($LASTEXITCODE -ne 0) { throw 'Parakeet model verification failed.' }
      - name: Real local Parakeet CPU quality probe
        id: local
        if: ${{ !inputs.cloud_kit_only }}
        shell: pwsh
        run: |
          python benchmarks/parakeet.py --model artifacts/parakeet-model/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8 --corpus artifacts/public-corpus/corpus.json --repeats 2 --output artifacts/parakeet-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Local Parakeet inference failed.' }
      - name: Public corpus for the cloud kit (16 clips per language, 5/15/30/45/60 s concatenations)
        shell: pwsh
        run: |
          python benchmarks/fetch_public.py --output artifacts/experiment-corpus --count 16 --durations 5,15,30,45,60
          if ($LASTEXITCODE -ne 0) { throw 'Experiment corpus fetch failed.' }
      - name: Self-contained Windows cloud test kit (no API request in CI)
        id: cloud_kit
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet publish tools/JLVoice.NvidiaProbe -c Release -r win-x64 --self-contained true -o artifacts/NvidiaCloudTest
          if ($LASTEXITCODE -ne 0) { throw 'Cloud test kit publish failed.' }
          & ./artifacts/NvidiaCloudTest/JLVoice.NvidiaProbe.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Cloud test kit contract tests failed.' }
          Copy-Item artifacts/experiment-corpus artifacts/NvidiaCloudTest/public-corpus -Recurse
          Copy-Item docs/NVIDIA-PROBE.md artifacts/NvidiaCloudTest/README.md
          Copy-Item docs/NVIDIA-LANGUAGE-EXPERIMENT.md artifacts/NvidiaCloudTest/LANGUAGE-EXPERIMENT.md
          # Dry runs only: verify the packaged corpus hashes and the request plan. No key is read and nothing is sent.
          foreach ($set in 'short','duration','all') {
            & ./artifacts/NvidiaCloudTest/JLVoice.NvidiaProbe.exe --language-experiment --set $set
            if ($LASTEXITCODE -ne 0) { throw "Language experiment dry run failed: $set" }
          }
          New-Item -ItemType Directory -Force artifacts/NvidiaCloudTest/licenses | Out-Null
          Copy-Item LICENSE artifacts/NvidiaCloudTest/licenses/JLVoice-MIT.txt
          Copy-Item LICENSE-SCOPE.md artifacts/NvidiaCloudTest/licenses/LICENSE-SCOPE.md
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/NvidiaCloudTest/licenses/THIRD_PARTY_NOTICES.md
          $packages = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { "$env:USERPROFILE/.nuget/packages" }
          $notices = Get-ChildItem "$packages/microsoft.netcore.app.runtime.win-x64" -Recurse -File | Where-Object { $_.Name -match '^(licen[cs]e|third.party.notices)' }
          if (-not $notices) { throw 'Self-contained runtime license notices missing.' }
          $notices | ForEach-Object {
            $name = $_.FullName.Substring($packages.Length) -replace '[/\\:]','_'
            Copy-Item $_.FullName "artifacts/NvidiaCloudTest/licenses/$name"
          }
          $localPassed = '${{ steps.local.conclusion }}' -eq 'success'
          @{ source_commit = (git rev-parse HEAD); cloud_api_executed_in_ci = $false; local_parakeet_executed = $localPassed; release = $false; signed = $false } | ConvertTo-Json | Set-Content artifacts/NvidiaCloudTest/BUILD-INFO.json -Encoding utf8NoBOM
          Get-ChildItem artifacts/NvidiaCloudTest -Recurse -File | ForEach-Object {
            @{ path = [IO.Path]::GetRelativePath("$pwd/artifacts/NvidiaCloudTest", $_.FullName); sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          } | ConvertTo-Json | Set-Content artifacts/NvidiaCloudTest/SHA256SUMS.json -Encoding utf8NoBOM
      - name: Local measurements and public provenance only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NVIDIA-local-CPU-evidence
          path: |
            artifacts/parakeet-windows.json
            artifacts/public-corpus/corpus.json
          retention-days: 7
      - name: Owner-requested Windows cloud test kit
        if: ${{ !cancelled() && steps.cloud_kit.conclusion == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JLVoice-NVIDIA-Cloud-Test-Windows-x64
          path: artifacts/NvidiaCloudTest/
          if-no-files-found: error
          retention-days: 7
